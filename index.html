<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF7F2;
    --ink: #2B2621;
    --ink-dim: #8A7F72;
    --accent: #D98E3F;
    --accent-soft: #F1DDB4;
    --line: #E6DCCB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Mitr', sans-serif;
    font-weight:300;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 64px 22px 60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .page{ width:100%; max-width:420px; }

  /* ---- Cat mark (signature) ---- */
  .cat-wrap{ display:flex; justify-content:center; margin-bottom:22px; }
  .cat{ width:74px; height:74px; overflow:visible; }
  .cat path, .cat circle{
    fill:none; stroke:var(--ink); stroke-width:2.4;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .cat .eye{ fill:var(--ink); stroke:none; }
  .cat .nose{ fill:var(--accent); stroke:var(--accent); }
  .cat .tail{
    transform-origin: 61px 52px;
    animation: swish 4.5s ease-in-out infinite;
  }
  @keyframes swish{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(-8deg); }
  }

  /* ---- Header ---- */
  .header{ text-align:center; margin-bottom:44px; }
  .name{
    font-family:'Chonburi', 'Mitr', serif;
    font-size:27px; font-weight:400;
    margin:0 0 8px; letter-spacing:0.2px;
  }
  .tagline{
    font-size:14px; color:var(--ink-dim); margin:0;
    line-height:1.7; font-weight:300;
  }

  /* ---- Link list: minimal rows, paw-print markers ---- */
  .links{
    display:flex; flex-direction:column;
  }
  .link-row{
    display:flex; align-items:center; gap:14px;
    text-decoration:none; color:var(--ink);
    padding:18px 4px;
    border-bottom:1px solid var(--line);
    transition: background .15s ease, padding-left .15s ease;
  }
  .link-row:first-child{ border-top:1px solid var(--line); }
  .link-row:hover{
    background: var(--accent-soft);
    padding-left:10px;
  }
  .link-row:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .paw{ width:18px; height:18px; flex-shrink:0; opacity:0.75; }
  .paw path{ fill:var(--accent); }

  .link-body{ flex:1; min-width:0; }
  .link-title{
    font-size:15.5px; font-weight:500; margin:0 0 2px;
  }
  .link-sub{
    font-size:12px; color:var(--ink-dim); margin:0; font-weight:300;
  }
  .link-go{
    font-family:'Mitr'; font-size:13px; color:var(--ink-dim);
  }

  .footer{
    text-align:center; margin-top:42px;
    font-size:11.5px; color:var(--ink-dim); opacity:0.7;
    letter-spacing:0.4px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="cat-wrap">
    <svg class="cat" viewBox="0 0 90 80" xmlns="http://www.w3.org/2000/svg">
      <!-- ears -->

      <path d="M70 26 L76 6 L56 20 Z"/>
      <!-- head -->
      <path d="M20 26 Q45 6 70 26 Q78 42 62 54 Q45 62 28 54 Q12 42 20 26 Z"/>

      <circle class="eye" cx="36" cy="34" r="2.3"/>
      <circle class="eye" cx="54" cy="34" r="2.3"/>
      <!-- nose + mouth -->
      <path class="nose" d="M43 42 L47 42 L45 45 Z"/>
      <path d="M45 45 Q45 49 40 50"/>
      <path d="M45 45 Q45 49 50 50"/>
      <!-- whiskers -->
      <path d="M14 38 L28 40"/>
      <path d="M14 44 L28 43"/>
      <path d="M76 38 L62 40"/>
      <path d="M76 44 L62 43"/>
      <!-- body -->

</body>
</html>
